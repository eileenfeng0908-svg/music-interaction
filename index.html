<title>Five Rooms</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Mono:wght@400&display=swap">
<style>
/* Layout: one quiet room. The pattern fills the screen; a small control strip sits at the bottom centre. */
:root {
  color-scheme: light;
  --ground: #F0EEE4;   /* PANTONE 11-4300 TCX, screen equivalent */
  --ink: #2A2C2A;
  --soft: #8C8A80;
  --line: rgba(42, 44, 42, 0.16);
  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); overflow: hidden; font-family: var(--mono); font-size: 11px; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.hint {
  margin: 0; text-align: center;
  font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--soft);
  transition: opacity 1.2s;
}
.playing .hint { opacity: 0; }

.controls {
  position: fixed; left: 0; right: 0;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  display: grid; justify-items: center; gap: 14px;
  padding-inline: 16px;
}
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }

button {
  font: inherit; color: var(--ink); background: transparent;
  border: 1px solid transparent; border-radius: 999px; cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }
button:disabled { color: var(--line); cursor: default; }

.rooms button { width: 40px; height: 40px; font-family: var(--serif); font-size: 20px; font-variant-numeric: lining-nums; }
.rooms button:not(:disabled):hover { border-color: var(--line); }
.rooms button[aria-current="true"] { border-color: var(--ink); }

.pieces button { min-width: 34px; height: 26px; padding: 0 8px; font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--soft); }
.pieces button:hover { color: var(--ink); }
.pieces button[aria-pressed="true"] { color: var(--ink); border-color: var(--line); }

.play { width: 52px; height: 52px; border-color: var(--ink); display: grid; place-items: center; }
.play:hover { background: rgba(42, 44, 42, 0.05); }
.play svg { width: 16px; height: 16px; fill: var(--ink); }
.play .pause { display: none; }
.playing .play .pause { display: block; }
.playing .play .start { display: none; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<canvas id="art" aria-label="An image that moves with the sound."></canvas>

<nav class="controls" aria-label="Artwork controls">
  <p class="hint" id="hint">Press play. Listen before you name it.</p>
  <div class="row pieces" id="pieces" aria-label="Pieces"></div>
  <button class="play" id="play" aria-label="Play">
    <svg class="start" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z"/></svg>
    <svg class="pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3.2v11H3.5zM9.3 2.5h3.2v11H9.3z"/></svg>
  </button>
  <div class="row rooms" id="rooms" aria-label="Styles"></div>
</nav>
<p class="sr" id="live" role="status"></p>

<script src="audio/track-1-1.js"></script>
<script src="audio/track-2-1.js"></script>
<script>
// ================================================================
// 1. THE ROOMS — five styles, each with three pieces.
//    Names are left out on purpose: the audience guesses first.
// ================================================================
const ROOMS = [
  { pieces: [
      { sound: "file", file: "1-1", art: "medallion" },
      { sound: "generated", make: "maqsum", art: "arch" },
      { sound: "generated", make: "saidi",  art: "loom" }
  ] },
  { pieces: [
      { sound: "file", file: "2-1", art: "moon" },
      { sound: "generated", make: "bulerias", art: "manton" },
      { sound: "generated", make: "tangos",   art: "feria" }
  ] },
  null, null, null // rooms 3 to 5 arrive later
];
let roomIndex = 0, pieceIndex = 0;

// Colours sampled from the reference images.
const C = {
  teal: "#3E9690", deep: "#174339", jade: "#7DBFB0", gold: "#C49A3E",
  coral: "#DB8B74", crimson: "#A8392F", ivory: "#F8F2E2", lapis: "#2F5AA0",
  ochre: "#E0A22E", leaf: "#4FA36E", ink: "#24302D", plum: "#5B3550"
};

// ================================================================
// 2. SOUND — play a piece and measure it
// ================================================================
let ctx = null, analyser, bins, master, nowPlaying = null;
const decoded = {};

function setupAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.6;
  bins = new Uint8Array(analyser.frequencyBinCount);
  master = ctx.createGain();
  master.connect(analyser);
  master.connect(ctx.destination);
}

function base64ToBuffer(b64) {
  const s = atob(b64), out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out.buffer;
}

async function startPiece(piece) {
  stopPiece();
  const out = ctx.createGain();
  out.gain.value = 0;
  out.gain.setTargetAtTime(1, ctx.currentTime, 0.08);
  out.connect(master);
  let stopSound;
  if (piece.sound === "file") {
    if (!decoded[piece.file]) decoded[piece.file] = await ctx.decodeAudioData(base64ToBuffer(window.TRACK_DATA[piece.file]));
    const src = ctx.createBufferSource();
    src.buffer = decoded[piece.file];
    src.loop = true;
    src.connect(out);
    src.start();
    stopSound = () => src.stop(ctx.currentTime + 0.4);
  } else {
    stopSound = COMPOSERS[piece.make](ctx, out);
  }
  nowPlaying = { stop() { out.gain.setTargetAtTime(0, ctx.currentTime, 0.08); stopSound(); setTimeout(() => out.disconnect(), 600); } };
}
function stopPiece() { if (nowPlaying) nowPlaying.stop(); nowPlaying = null; }

// --- Instruments built from scratch with the Web Audio API ---
function instruments(ctx, out) {
  const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const decay = (g, t, peak, len) => { g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0008, t + len); };
  const hiss = (t, type, f, q, peak, len) => {
    const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    decay(g, t, peak, len); s.connect(fl).connect(g).connect(out);
    s.start(t, Math.random() * 0.5); s.stop(t + len + 0.05);
  };
  return {
    // Hand drum: deep "dum" in the middle, sharp "tek" on the rim.
    dum(t, v = 1) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(52, t + 0.16);
      decay(g, t, 0.85 * v, 0.42); o.connect(g).connect(out); o.start(t); o.stop(t + 0.5);
      hiss(t, "lowpass", 380, 1, 0.25 * v, 0.07);
    },
    tek(t, v = 1) { hiss(t, "bandpass", 3300, 2.2, 0.5 * v, 0.07); },
    ka(t, v = 1) { hiss(t, "bandpass", 2300, 2, 0.22 * v, 0.05); },
    jingle(t, v = 1) { hiss(t, "highpass", 7500, 0.7, 0.1 * v, 0.16); },
    // Plucked string: a bright tone that quickly darkens.
    pluck(t, f, len = 0.6, v = 1) {
      const a = ctx.createOscillator(), b = ctx.createOscillator(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
      a.type = "sawtooth"; b.type = "triangle"; a.frequency.value = f; b.frequency.value = f * 1.004;
      fl.type = "lowpass"; fl.Q.value = 4;
      fl.frequency.setValueAtTime(Math.min(5200, f * 14), t); fl.frequency.exponentialRampToValueAtTime(Math.max(300, f * 2), t + 0.22);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.16 * v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0008, t + len);
      a.connect(fl); b.connect(fl); fl.connect(g).connect(out);
      a.start(t); b.start(t); a.stop(t + len + 0.05); b.stop(t + len + 0.05);
    },
    // Breathy flute with a slow vibrato.
    flute(t, f, len, v = 1) {
      const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain();
      const lfo = ctx.createOscillator(), depth = ctx.createGain();
      o.frequency.value = f; o2.type = "triangle"; o2.frequency.value = f * 2; g2.gain.value = 0.12;
      lfo.frequency.value = 5.2; depth.gain.setValueAtTime(0, t); depth.gain.linearRampToValueAtTime(f * 0.008, t + Math.min(0.6, len));
      lfo.connect(depth); depth.connect(o.frequency); depth.connect(o2.frequency);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.1 * v, t + 0.16);
      g.gain.setValueAtTime(0.1 * v, t + len); g.gain.linearRampToValueAtTime(0, t + len + 0.3);
      o.connect(g); o2.connect(g2).connect(g); g.connect(out);
      for (const n of [o, o2, lfo]) { n.start(t); n.stop(t + len + 0.35); }
      hiss(t, "bandpass", f * 2, 6, 0.05 * v, len + 0.2);
    },
    drone(freqs, level) {
      const fl = ctx.createBiquadFilter(), g = ctx.createGain();
      fl.type = "lowpass"; fl.frequency.value = 520; g.gain.value = level;
      fl.connect(g).connect(out);
      const oscs = freqs.map(f => { const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f; o.connect(fl); o.start(); return o; });
      return () => oscs.forEach(o => o.stop(ctx.currentTime + 0.5));
    }
  };
}

// The scale heard in the first piece (C, D, E flat, F sharp, G, A flat, B).
const SCALE = [0, 2, 3, 6, 7, 8, 11], ROOT = 130.81;
function pitch(step) { const o = Math.floor(step / 7), d = ((step % 7) + 7) % 7; return ROOT * Math.pow(2, o + SCALE[d] / 12); }
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// A short melody that repeats, then changes a little, like a musician improvising.
function makeMotif(length, low, high, density) {
  const m = []; let s = 4;
  for (let i = 0; i < length; i++) {
    if (Math.random() > density && i % 4 !== 0) { m.push(null); continue; }
    s = Math.max(low, Math.min(high, s + pick([-2, -1, -1, 0, 1, 1, 2])));
    m.push(s);
  }
  m[length - 2] = pick([0, 4, 7]); m[length - 1] = null;
  return m;
}
function vary(m, low, high) {
  return m.map((s, i) => (s !== null && Math.random() < 0.3 && i < m.length - 2) ? Math.max(low, Math.min(high, s + pick([-1, 1]))) : s);
}

function runScheduler(ctx, stepLen, playStep) {
  let i = 0, t = ctx.currentTime + 0.12;
  const tick = () => { while (t < ctx.currentTime + 0.15) { playStep(i, t); t += stepLen; i++; } };
  tick();
  const id = setInterval(tick, 25);
  return () => clearInterval(id);
}

const COMPOSERS = {
  // Piece ii: 117 beats a minute, a busy drum pattern and a plucked melody.
  maqsum(ctx, out) {
    const I = instruments(ctx, out);
    const stopDrone = I.drone([ROOT / 2, ROOT * 0.75], 0.05);
    const sixteenth = 60 / 117 / 4;
    let motif = makeMotif(16, 2, 11, 0.75);
    const stopClock = runScheduler(ctx, sixteenth, (i, t) => {
      const s = i % 16, bar = Math.floor(i / 16);
      if (s === 0 || s === 8) I.dum(t);
      if (s === 2 || s === 6 || s === 12) I.tek(t);
      if ((s === 10 || s === 14) && Math.random() < 0.6) I.ka(t);
      if (bar % 4 === 3 && s >= 12) I.tek(t, 0.5 + (s - 12) * 0.15);
      if (s % 2 === 0) {
        const n = motif[(s / 2) + (bar % 2) * 8];
        if (n !== null) {
          if (Math.random() < 0.18) I.pluck(t, pitch(n + 1), 0.15, 0.6);
          I.pluck(t + (Math.random() < 0.18 ? sixteenth * 0.5 : 0), pitch(n), sixteenth * 5);
        }
      }
      if (s === 15 && bar % 4 === 3) motif = Math.random() < 0.25 ? makeMotif(16, 2, 11, 0.75) : vary(motif, 2, 11);
    });
    return () => { stopClock(); stopDrone(); };
  },
  // Piece iii: slower, 84 beats a minute, a flute calls and a plucked zither answers.
  saidi(ctx, out) {
    const I = instruments(ctx, out);
    const stopDrone = I.drone([ROOT / 2], 0.06);
    const sixteenth = 60 / 84 / 4;
    let phrase = makeMotif(8, 3, 12, 0.85);
    const stopClock = runScheduler(ctx, sixteenth, (i, t) => {
      const s = i % 16, bar = Math.floor(i / 16);
      if (s === 0 || s === 6 || s === 8) I.dum(t, s === 8 ? 0.8 : 1);
      if (s === 2 || s === 12) I.tek(t);
      if (s % 4 === 2) I.jingle(t);
      if (bar % 2 === 0) {
        if (s % 4 === 0) {
          const n = phrase[s / 4 + (bar % 4 === 2 ? 4 : 0)];
          if (n !== null) I.flute(t, pitch(n) * 2, sixteenth * 3.6);
        }
      } else {
        const up = [0, 1, 2, 3, 4, 5, 6, 7, 7, 6, 5, 4, 3, 2, 1, 0];
        if (s % 2 === 0 || Math.random() < 0.4) I.pluck(t, pitch(up[s] + 7), 0.3, 0.55);
      }
      if (s === 15 && bar % 4 === 3) phrase = vary(phrase, 3, 12);
    });
    return () => { stopClock(); stopDrone(); };
  }
};

// --- Room 2 instruments: guitar, palmas (hand claps), cajón and castanets ---
function flamencoKit(ctx, out) {
  const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const hiss = (t, type, f, q, peak, len) => {
    const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0008, t + len);
    s.connect(fl).connect(g).connect(out); s.start(t, Math.random() * 0.5); s.stop(t + len + 0.05);
  };
  // A guitar string, made by sending a burst of noise round a short loop (Karplus-Strong).
  // Each string sound is worked out once and then reused.
  const strings = {};
  const stringBuffer = f => {
    const key = Math.round(f * 10);
    if (strings[key]) return strings[key];
    const sr = ctx.sampleRate, len = Math.floor(sr * 1.6), buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    const p = Math.max(2, Math.round(sr / f)), loop = new Float32Array(p);
    for (let i = 0; i < p; i++) loop[i] = Math.random() * 2 - 1;
    let prev = 0;
    for (let i = 0; i < len; i++) {
      const j = i % p, next = loop[(j + 1) % p];
      loop[j] = 0.996 * 0.5 * (loop[j] + next);
      const v = loop[j]; d[i] = v - prev * 0.2; prev = v;
    }
    return (strings[key] = buf);
  };
  const body = ctx.createBiquadFilter(); // the wooden body of the guitar softens the top end
  body.type = "peaking"; body.frequency.value = 220; body.gain.value = 5; body.Q.value = 1;
  const tone = ctx.createBiquadFilter(); tone.type = "lowpass"; tone.frequency.value = 4200;
  body.connect(tone).connect(out);
  const pluck = (t, f, len, v) => {
    const s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = stringBuffer(f);
    g.gain.setValueAtTime(0.32 * v, t); g.gain.setValueAtTime(0.32 * v, t + len); g.gain.linearRampToValueAtTime(0, t + len + 0.08);
    s.connect(g).connect(body); s.start(t); s.stop(t + len + 0.1);
  };
  return {
    pluck,
    // A strum: the strings sound one after another, low to high (down) or high to low (up).
    strum(t, chord, dir = 1, spread = 0.012, v = 1, len = 0.9) {
      const notes = dir > 0 ? chord : [...chord].reverse();
      notes.forEach((f, i) => pluck(t + i * spread, f, len, v * (0.75 + Math.random() * 0.25)));
      hiss(t, "highpass", 3000, 0.7, 0.05 * v, 0.05); // the nail on the strings
    },
    // Several pairs of hands clapping at once.
    palmas(t, v = 1) { for (const o of [0, 0.005, 0.011]) hiss(t + o, "bandpass", 1300 + Math.random() * 500, 1.4, 0.45 * v, 0.045); },
    sorda(t, v = 1) { hiss(t, "bandpass", 700, 1.2, 0.3 * v, 0.06); }, // muffled clap
    cajon(t, v = 1) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.12);
      g.gain.setValueAtTime(0.9 * v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + 0.3);
      o.connect(g).connect(out); o.start(t); o.stop(t + 0.35);
      hiss(t, "lowpass", 500, 1, 0.3 * v, 0.06);
    },
    slap(t, v = 1) { hiss(t, "bandpass", 2400, 1.3, 0.45 * v, 0.08); hiss(t, "highpass", 5000, 0.7, 0.12 * v, 0.14); },
    castanets(t, v = 1, roll = 1) { for (let k = 0; k < roll; k++) hiss(t + k * 0.028, "bandpass", 3600 + k * 200, 7, 0.55 * v, 0.025); }
  };
}

// The flamenco key: A with a B flat just above it, which gives the Spanish sound.
const SPAIN = [0, 1, 4, 5, 7, 8, 10], SPAIN_ROOT = 110;
function spainPitch(step) { const o = Math.floor(step / 7), d = ((step % 7) + 7) % 7; return SPAIN_ROOT * Math.pow(2, o + SPAIN[d] / 12); }
// Guitar chords for the Andalusian cadence (D minor, C, B flat, A).
const CHORDS = {
  A:  [110.00, 164.81, 220.00, 277.18, 329.63, 466.16],
  Bb: [116.54, 174.61, 233.08, 293.66, 349.23, 466.16],
  C:  [130.81, 164.81, 196.00, 261.63, 329.63, 392.00],
  Dm: [146.83, 220.00, 293.66, 349.23, 440.00]
};
// A guitar run that falls through the scale down to A, the way flamenco phrases end.
function falseta(len) {
  const m = []; let s = 7 + Math.floor(Math.random() * 5);
  for (let i = 0; i < len; i++) {
    const left = len - i;
    if (left <= 3) s = [2, 1, 0][3 - left];
    else s = Math.max(1, Math.min(13, s + pick([-1, -1, -1, 1, -2, 0, 1]))); // mostly downward
    m.push(s);
  }
  return m;
}

Object.assign(COMPOSERS, {
  // Room 2, piece ii: a fast 12-beat cycle, accents on 3, 6, 8, 10 and 12, with palmas, cajón and guitar.
  bulerias(ctx, out) {
    const F = flamencoKit(ctx, out);
    const beat = 60 / 186, eighth = beat / 2;
    const ACCENT = [3, 6, 8, 10, 12];
    let run = falseta(10);
    const stopClock = runScheduler(ctx, eighth, (i, t) => {
      const e = i % 24, b = Math.floor(e / 2) + 1, on = e % 2 === 0, cycle = Math.floor(i / 24);
      const accent = on && ACCENT.includes(b);
      const cadence = cycle % 4 === 3;
      // palmas: every beat, louder on the accents, with off-beat claps now and then
      if (on) F.palmas(t, accent ? 1 : 0.45); else if (Math.random() < 0.3) F.sorda(t, 0.7);
      // cajón: deep on 3 and 10, sharp slaps on 6, 8 and 12
      if (on && (b === 3 || b === 10)) F.cajon(t);
      if (on && (b === 6 || b === 8 || b === 12)) F.slap(t);
      if (!on && Math.random() < 0.15) F.slap(t, 0.3);
      // guitar
      const chord = cadence ? (b <= 3 ? CHORDS.Dm : b <= 6 ? CHORDS.C : b <= 8 ? CHORDS.Bb : CHORDS.A)
                            : (b >= 4 && b <= 8 ? CHORDS.Bb : CHORDS.A);
      if (cycle % 2 === 1 && !cadence) {
        // a falseta: single notes picked fast
        if (e < 20) { const n = run[Math.floor(e / 2)]; if (e % 2 === 0 || Math.random() < 0.5) F.pluck(t, spainPitch(n + 7), 0.35, 0.9); }
        if (accent && b === 12) F.strum(t, CHORDS.A, 1, 0.01, 1);
      } else if (accent) {
        F.strum(t, chord, 1, 0.009, 1.1);
        if (b === 12) for (let k = 1; k < 4; k++) F.strum(t + k * eighth / 4, chord, -1, 0.004, 0.55, 0.2); // a rasgueado roll
      } else if (on && Math.random() < 0.6) F.strum(t, chord, Math.random() < 0.5 ? 1 : -1, 0.006, 0.45, 0.3);
      if (accent && cycle % 2 === 0 && Math.random() < 0.4) F.castanets(t + eighth, 0.6, 3);
      if (e === 23 && cycle % 2 === 0) run = falseta(10);
    });
    return () => stopClock();
  },
  // Room 2, piece iii: a slower four-beat cycle, a flute sings over guitar strums and cajón.
  tangos(ctx, out) {
    const F = flamencoKit(ctx, out), I = instruments(ctx, out);
    const sixteenth = 60 / 104 / 4;
    const order = ["Dm", "C", "Bb", "A"];
    let phrase = falseta(8);
    const stopClock = runScheduler(ctx, sixteenth, (i, t) => {
      const s = i % 16, bar = Math.floor(i / 16), chord = CHORDS[order[bar % 4]];
      // palmas on beats 2, 3 and 4 (beat 1 is left silent, as in the dance)
      if (s === 4 || s === 8 || s === 12) F.palmas(t, s === 12 ? 1 : 0.6);
      if (s === 6 || s === 10 || s === 14) F.sorda(t, 0.5);
      // cajón
      if (s === 0 || s === 10) F.cajon(t);
      if (s === 4 || s === 12) F.slap(t);
      if ((s === 7 || s === 15) && Math.random() < 0.5) F.slap(t, 0.25);
      // guitar strum pattern: down, down-up, with a rasgueado on beat 4
      if (s === 0) F.strum(t, chord, 1, 0.012, 1);
      if (s === 6) F.strum(t, chord, 1, 0.008, 0.6, 0.4);
      if (s === 7 || s === 11) F.strum(t, chord, -1, 0.006, 0.4, 0.25);
      if (s === 12) for (let k = 0; k < 4; k++) F.strum(t + k * sixteenth / 2, chord, k % 2 ? -1 : 1, 0.005, 0.55, 0.25);

      if (Math.floor(bar / 2) % 2 === 0 && s % 4 === 0) {
        const n = phrase[(bar % 2) * 4 + s / 4];
        if (Math.random() < 0.85) I.flute(t, spainPitch(n + 7), sixteenth * 3.5, 0.9);

// Turn the sound into numbers the drawing can use.
const S = { bass: 0, mid: 0, high: 0, pulse: 0, bassAvg: 0, spec: new Array(16).fill(0), rot: 0, wave: -1, lastBeat: 0 };
function listen(dt, time) {
  const quiet = !nowPlaying;
  if (!quiet) analyser.getByteFrequencyData(bins);
  const hz = ctx ? ctx.sampleRate / analyser.fftSize : 23;
  const band = (lo, hi) => {
    if (quiet) return 0;
    const a = Math.max(1, Math.floor(lo / hz)), b = Math.max(a + 1, Math.floor(hi / hz));
    let sum = 0; for (let i = a; i < b; i++) sum += bins[i];
    return sum / (b - a) / 255;
  };
  const ease = (cur, target) => cur + (target - cur) * (target > cur ? 0.5 : 0.08);
  S.bass = ease(S.bass, band(40, 180));
  S.mid = ease(S.mid, band(180, 2000));
  S.high = ease(S.high, band(2000, 9000));
  for (let i = 0; i < 16; i++) {
    const lo = 60 * Math.pow(8000 / 60, i / 16), hi = 60 * Math.pow(8000 / 60, (i + 1) / 16);
    S.spec[i] = ease(S.spec[i], band(lo, hi));
  }
  S.bassAvg = S.bassAvg * 0.95 + S.bass * 0.05;
  if (!quiet && S.bass > S.bassAvg * 1.15 + 0.03 && S.bass > 0.25 && time - S.lastBeat > 0.22) {
    S.lastBeat = time; S.pulse = 1; S.wave = 0; onBeat();
  }
  S.pulse *= Math.pow(0.02, dt);
  if (S.wave >= 0) S.wave += dt * 5; if (S.wave > 6) S.wave = -1;
  S.rot += dt * (0.03 + S.mid * 0.5);
}

// ================================================================
// 3. THE PATTERNS — each piece draws a pattern, and a kaleidoscope
//    reflects a moving slice of it.
// ================================================================
const TAU = Math.PI * 2;
const SIZE = 1024; // patterns are drawn on a 1024 x 1024 sheet
let g = null; // the drawing surface; set to the screen before each frame

function shape(fill, stroke, width) {
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = width; g.stroke(); }
}
function star(r, inner, points, rot) {
  g.beginPath();

    g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);

  g.closePath();
}
// A pointed leaf, tip at (0, -len).
function leaf(len, wid) {
  g.beginPath(); g.moveTo(0, -len);
  g.bezierCurveTo(wid, -len * 0.55, wid * 0.9, len * 0.15, 0, len * 0.3);
  g.bezierCurveTo(-wid * 0.9, len * 0.15, -wid, -len * 0.55, 0, -len);

// A lobed cartouche, long axis vertical.

  g.beginPath(); g.moveTo(0, -s * 1.35);
  g.bezierCurveTo(s * 0.15, -s * 0.75, s * 1.0, -s * 0.7, s, 0);
  g.bezierCurveTo(s * 1.0, s * 0.7, s * 0.15, s * 0.75, 0, s * 1.35);
  g.bezierCurveTo(-s * 0.15, s * 0.75, -s * 1.0, s * 0.7, -s, 0);
  g.bezierCurveTo(-s * 1.0, -s * 0.7, -s * 0.15, -s * 0.75, 0, -s * 1.35);

  g.globalAlpha = alpha;
  for (let k = 0; k < 5; k++) { g.save(); g.rotate((k * TAU) / 5); g.beginPath(); g.ellipse(0, -r * 0.55, r * 0.32, r * 0.5, 0, 0, TAU); shape(petal); g.restore(); }

  g.globalAlpha = 1;
}
function paper(colour) { g.fillStyle = colour; g.fillRect(0, 0, SIZE, SIZE); }

// --- Pattern for piece i: a radiant medallion ---
// Colours of an illuminated manuscript page: lapis blue, turquoise, gold leaf, tile red, cream.
const P = { night: "#16244E", lapis: "#22407F", turquoise: "#3E9C9A", gold: "#C9A04A", paleGold: "#E6C877", red: "#B5392C", cream: "#F3E8CF" };
function medallion(t) {
  paper(P.night);
  const R = 410 * (1 + 0.03 * S.pulse);
  g.save(); g.translate(SIZE / 2, SIZE / 2);
  const rot = S.rot * 0.5, N = 16;
  for (let i = 0; i < N; i++) {
    const e = S.spec[i % 16];
    g.save(); g.rotate(rot + (i * TAU) / N);

    const end = R * (long ? 1.0 + 0.22 * e : 0.82 + 0.14 * e) + Math.sin(t * 0.8 + i) * R * 0.01;
    g.beginPath(); g.moveTo(0, -R * 0.6); g.lineTo(0, -end); shape(null, P.gold, 1.6);
    g.save(); g.translate(0, -end); star(R * 0.028, R * 0.012, 2, 0); shape(P.turquoise, P.gold, 1.5); g.restore();
    g.save(); g.translate(0, -R * (long ? 0.8 : 0.72)); leaf(R * 0.07 * (0.85 + e * 0.6), R * 0.05);
    shape(long ? P.turquoise : P.cream, P.gold, 2);
    g.beginPath(); g.arc(0, -R * 0.015, R * 0.012, 0, TAU); shape(P.red); g.restore();
    g.restore();
  }
  for (let i = 0; i < N; i++) {
    const e = S.spec[(i + 3) % 16];
    g.save(); g.rotate(rot + (i + 0.5) * TAU / N); g.translate(0, -R * 0.5);
    cartouche(R * 0.085 * (0.92 + e * 0.3)); shape(P.lapis, P.gold, 2.5);
    cartouche(R * 0.06 * (0.92 + e * 0.3)); shape(P.turquoise);
    floret(R * 0.05, i % 2 ? P.cream : P.red, P.paleGold, 0.85 + 0.15 * Math.min(1, S.high * 3 + Math.sin(t * 3 + i)));
    g.restore();
  }
  g.beginPath(); g.arc(0, 0, R * 0.37, 0, TAU); shape(P.lapis, P.gold, 2.5);
  for (let i = 0; i < 48; i++) {
    const a = (i * TAU) / 48 - rot * 0.4;
    g.beginPath(); g.arc(Math.cos(a) * R * 0.345, Math.sin(a) * R * 0.345, R * 0.007 * (1 + S.spec[i % 16] * 2), 0, TAU); shape(P.paleGold);
  }
  g.beginPath(); g.arc(0, 0, R * 0.32, 0, TAU); shape(P.cream, P.gold, 2);
  for (let i = 0; i < 8; i++) {
    g.save(); g.rotate(-rot * 0.8 + (i * TAU) / 8);
    leaf(R * 0.27 * (0.85 + S.bass * 0.3), R * 0.11); shape(P.red, P.gold, 2);
    leaf(R * 0.16 * (0.85 + S.bass * 0.3), R * 0.055); shape(P.paleGold);
    g.restore();
  }
  star(R * 0.1, R * 0.07, 8, rot); shape(P.lapis, P.gold, 2);
  star(R * 0.05, R * 0.032, 8, -rot); shape(P.paleGold);
  g.restore();
}

// --- Piece ii: a horseshoe arch with a lit lattice screen and lanterns ---
const arch = { lattice: 0, prev: 0, mix: 1, swing: 0 };
function latticeCells(type, x0, y0, w, h, s, t, alpha) {
  g.globalAlpha = alpha;
  const glow = `rgba(243,199,102,${0.35 + Math.min(0.6, S.bass * 0.8)})`;
  const hex = type === 1, rowH = hex ? s * Math.sqrt(3) / 2 : s;
  for (let j = -1; j * rowH < h + s; j++) for (let i = -1; i * s < w + s; i++) {
    const x = x0 + i * s + (hex && j % 2 ? s / 2 : 0), y = y0 + j * rowH;
    const e = S.spec[Math.abs(i + j * 3) % 16], spin = t * 0.15 * ((i + j) % 2 ? 1 : -1);
    g.save(); g.translate(x, y);
    if (type === 0) star(s * 0.4, s * 0.4 * (0.62 + 0.15 * e), 8, spin + Math.PI / 8);
    else if (type === 1) star(s * 0.42, s * 0.42 * (0.55 + 0.2 * e), 6, spin);
    else star(s * 0.42, s * 0.42 * (0.78 + 0.12 * e), 12, spin);
    shape(glow, "#6B4226", s * 0.09);
    g.restore();
  }
  g.globalAlpha = 1;
}
function lantern(x, top, len, size, swing, glowAmt) {
  g.save(); g.translate(x, top); g.rotate(swing);
  g.strokeStyle = C.gold; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, len); g.stroke();
  g.translate(0, len);
  const halo = g.createRadialGradient(0, size * 1.1, 0, 0, size * 1.1, size * 3.2);
  halo.addColorStop(0, `rgba(255,200,110,${0.25 + glowAmt * 0.5})`); halo.addColorStop(1, "rgba(255,200,110,0)");
  g.fillStyle = halo; g.beginPath(); g.arc(0, size * 1.1, size * 3.2, 0, TAU); g.fill();
  g.beginPath(); // cap, body and point
  g.moveTo(0, 0); g.lineTo(size * 0.35, size * 0.35); g.lineTo(size * 0.55, size * 0.45);
  g.lineTo(size * 0.6, size * 1.6); g.lineTo(size * 0.3, size * 1.95); g.lineTo(0, size * 2.4);
  g.lineTo(-size * 0.3, size * 1.95); g.lineTo(-size * 0.6, size * 1.6); g.lineTo(-size * 0.55, size * 0.45); g.lineTo(-size * 0.35, size * 0.35); g.closePath();
  shape("#4A3020", C.gold, 1.2);
  for (const [wx, wy] of [[0, 0.75], [0, 1.3], [-0.3, 1.02], [0.3, 1.02]]) {
    g.save(); g.translate(wx * size, wy * size); star(size * 0.17, size * 0.08, 4, 0);
    shape(`rgba(255,214,120,${0.6 + glowAmt * 0.4})`); g.restore();
  }
  g.restore();
}
function zelligeBorder(x0, y0, w, h, bw) {
  const cols = [C.teal, C.ochre, C.deep, C.crimson];
  const n = Math.max(4, Math.round(w / bw)), m = Math.max(4, Math.round(h / bw));
  const tw = w / n, th = h / m, cells = [];
  for (let i = 0; i < n; i++) { cells.push([x0 + i * tw, y0, tw, bw]); cells.push([x0 + i * tw, y0 + h - bw, tw, bw]); }
  for (let j = 1; j < m - 1; j++) { cells.push([x0, y0 + j * th, bw, th]); cells.push([x0 + w - bw, y0 + j * th, bw, th]); }
  cells.forEach(([x, y, cw, ch], k) => {
    const e = S.spec[k % 16];
    g.save(); g.translate(x + cw / 2, y + ch / 2);
    const r = Math.min(cw, ch) * 0.42 * (0.85 + e * 0.3);
    star(r, r * 0.6, 8, Math.PI / 8 + (k % 2 ? 1 : -1) * S.rot * 0.4);
    shape(cols[k % cols.length], C.ivory, 1);
    g.beginPath(); g.arc(0, 0, r * 0.18, 0, TAU); shape(C.ivory);
    g.restore();
  });
}
function archScene(t, dt, box) {
  const h = box.h, w = Math.min(box.w, h * 0.7), x0 = box.x + (box.w - w) / 2, y0 = box.y;
  const bw = w * 0.075;
  g.fillStyle = C.ivory; g.fillRect(x0, y0, w, h);
  zelligeBorder(x0, y0, w, h, bw);
  const ix = x0 + bw, iy = y0 + bw, iw = w - 2 * bw, ih = h - 2 * bw;
  g.fillStyle = C.deep; g.fillRect(ix, iy, iw, ih);

  for (const side of [-1, 1]) {
    g.save(); g.translate(ix + iw / 2 + side * iw * 0.36, iy + iw * 0.14);
    star(iw * 0.06 * (1 + S.pulse * 0.3), iw * 0.03, 8, S.rot); shape(C.gold); g.restore();
  }
  const r = iw * 0.4, cx = ix + iw / 2, a0 = 0.42, cyA = iy + r * 1.22 + iw * 0.05, base = iy + ih;
  const archPath = rad => {
    g.beginPath(); g.moveTo(cx - rad * Math.cos(a0), base); g.lineTo(cx - rad * Math.cos(a0), cyA + rad * Math.sin(a0));
    g.arc(cx, cyA, rad, Math.PI - a0, TAU + a0); g.lineTo(cx + rad * Math.cos(a0), base); g.closePath();
  };

  const n = 19, from = Math.PI - a0, span = Math.PI + 2 * a0;
  for (let k = 0; k < n; k++) {
    const a1 = from + (k / n) * span, a2 = from + ((k + 1) / n) * span;
    g.beginPath(); g.arc(cx, cyA, r * 1.2, a1, a2); g.arc(cx, cyA, r, a2, a1, true); g.closePath();

  }
  arch.swing *= Math.pow(0.2, dt);
  [-0.55, 0, 0.55].forEach((p, i) => {
    const swing = Math.sin(t * 1.1 + i * 1.7) * 0.04 + arch.swing * Math.sin(t * 7 + i) * 0.12;
    lantern(cx + p * r, cyA - r, r * (i === 1 ? 0.55 : 0.38), r * 0.17, swing, Math.min(1, S.bass * 1.2));
  });
  g.restore();
  // scalloped edge on the inside of the arch
  for (let k = 0; k <= 14; k++) {
    const a = from + (k / 14) * span, rr = r * 0.045 * (0.85 + S.spec[(k + 5) % 16] * 0.6);
    g.beginPath(); g.arc(cx + Math.cos(a) * r, cyA + Math.sin(a) * r, rr, 0, TAU); shape("#F2E6CF", C.gold, 1);
  }
}

// --- Piece iii: the music weaves a kilim rug on a loom, row by row ---
// Every finished row stays, so the rug becomes a record of the song.
const WOOL = ["#EFE4CC", "#A8322A", "#23345E", "#D9A23A", "#4A2C22", "#3E8F8A"]; // ivory, madder red, indigo, saffron, walnut, turquoise
const loom = { cols: 72, rows: [], cur: [], at: 0, dir: 1, band: null, row: 0, timer: 0, spark: 0 };
function newBand(row) { // each band of motifs takes its colours and size from the music at that moment
  const loud = Math.min(1, S.bass * 0.6 + S.mid * 0.7);
  const bright = S.high > S.mid * 0.5;
  const pairs = bright ? [[3, 5], [5, 3]] : S.bass > S.mid ? [[2, 3], [3, 2]] : [[5, 0], [3, 2]];
  const [a, b] = pick(pairs);
  return { start: row, a, b, bg: Math.floor(row / 16) % 2 ? 2 : 1, size: 4 + Math.round(loud * 4), hooks: loud > 0.35 };
}
function knotColour(col, row, band) {
  const cols = loom.cols, cx = Math.min(col, cols - 1 - col); // mirror left and right
  if (cx === 0) return 4;
  if (cx === 1 || cx === 5) return 0;
  if (cx < 5) return ((row + cx) % 4 < 2) ? band.a : 4;          // running-triangle border
  const u = cols / 2 - 0.5 - col, x = ((u + 8) % 16 + 16) % 16 - 8, y = ((row - band.start) % 16) - 7.5;
  const d = Math.abs(x) + Math.abs(y), r = band.size;
  if ((row - band.start) % 16 === 15) return (col % 2) ? 4 : 0;   // a thin stripe between bands
  if (d < r * 0.45) return band.b;
  if (d < r * 0.45 + 1.4) return 0;
  if (d < r) return band.a;
  if (d < r + 1.2) return 4;
  if (band.hooks && Math.abs(Math.abs(x) - Math.abs(y)) < 0.8 && d < r + 4) return band.a;
  if (loom.spark > 0 && Math.random() < 0.04) return 3;
  return band.bg;
}
function loomScene(t, dt, box) {
  const w = Math.min(box.w, box.h * 1.35), x0 = box.x + (box.w - w) / 2;
  const beam = Math.max(10, box.h * 0.035);
  const k = Math.floor(Math.min(w / loom.cols, 14) * DPR) / DPR;   // one knot, snapped to whole pixels
  const rugW = k * loom.cols, rx = x0 + (w - rugW) / 2;
  const rowsVis = Math.floor((box.h - beam * 2 - k * 3) / k), ry = box.y + beam + k * 2;
  // weave: the shuttle crosses one knot at a time; louder music weaves faster
  if (!loom.started) { loom.started = true; loom.timer = loom.cols * 20; } // start with part of a rug already woven
  loom.timer += dt * (90 + 260 * Math.min(1, S.mid + S.bass * 0.5));
  if (!loom.band) loom.band = newBand(0);
  while (loom.timer >= 1) {
    loom.timer -= 1;
    const col = loom.dir > 0 ? loom.at : loom.cols - 1 - loom.at;
    loom.cur[col] = knotColour(col, loom.row, loom.band);
    if (++loom.at >= loom.cols) {
      loom.rows.push(loom.cur); loom.cur = []; loom.at = 0; loom.dir *= -1; loom.row++;
      if (loom.spark > 0) loom.spark--;
      if ((loom.row - loom.band.start) % 16 === 0) loom.band = newBand(loom.row);
      const keep = rowsVis - 6; // leave some bare threads showing below
      if (loom.rows.length > keep) loom.rows.splice(0, loom.rows.length - keep);
    }
  }
  // the loom frame: dark wood behind, warp threads stretched top to bottom
  g.fillStyle = "#2E211C"; g.fillRect(rx - k * 2, ry - k * 2, rugW + k * 4, rowsVis * k + k * 4);
  const done = loom.rows.length, curY = ry + done * k;
  const hum = Math.min(1, S.high * 3 + S.mid);
  g.strokeStyle = "rgba(239,228,204,0.75)"; g.lineWidth = Math.max(1, k * 0.18);
  for (let c = 0; c < loom.cols; c++) { // bare threads below the weaving tremble with the sound, like strings
    const x = rx + (c + 0.5) * k, len = ry + rowsVis * k - curY;
    if (len <= 0) continue;
    g.beginPath(); g.moveTo(x, curY);
    g.quadraticCurveTo(x + Math.sin(t * 30 + c * 1.7) * hum * k * 0.6, curY + len / 2, x, curY + len); g.stroke();
  }
  // the woven rows
  loom.rows.forEach((row, r) => {
    for (let c = 0; c < loom.cols; c++) { g.fillStyle = WOOL[row[c]]; g.fillRect(rx + c * k, ry + r * k, k, k); }
  });
  for (let c = 0; c < loom.cols; c++) if (loom.cur[c] !== undefined) { g.fillStyle = WOOL[loom.cur[c]]; g.fillRect(rx + c * k, curY, k, k); }
  // the shuttle carrying the thread across
  const sc = loom.dir > 0 ? loom.at : loom.cols - 1 - loom.at;
  g.save(); g.translate(rx + (sc + 0.5) * k, curY + k / 2);
  g.beginPath(); g.ellipse(0, 0, k * 2.4, k * 0.7, 0, 0, TAU); shape("#C08A4E", "#5A3A22", 1);
  g.beginPath(); g.ellipse(0, 0, k * 0.9, k * 0.3, 0, 0, TAU); shape(WOOL[loom.band.a]);
  g.restore();
  // wooden beams with tassels hanging from the top
  g.fillStyle = "#6B4A30"; g.fillRect(rx - k * 4, box.y, rugW + k * 8, beam);
  g.fillRect(rx - k * 4, ry + rowsVis * k + k * 2, rugW + k * 8, beam);
  g.strokeStyle = "#EFE4CC"; g.lineWidth = Math.max(1, k * 0.25);
  for (let c = 0; c < loom.cols; c += 2) {
    const x = rx + (c + 1) * k, sway = Math.sin(t * 2 + c * 0.3) * k * 0.3 * (1 + S.bass * 2);
    g.beginPath(); g.moveTo(x, box.y + beam); g.lineTo(x + sway, ry); g.stroke();
  }
}

// ================================================================
// Room 2 scenes
// ================================================================
// A spring: kick it and it swings back and forth, then settles.
function spring(sp, dt, stiff, damp) { sp.v += (-stiff * sp.x - damp * sp.v) * dt; sp.x += sp.v * dt; }

// --- Room 2, piece i: a flamenca dancing in front of a huge orange moon ---
// Her skirt is modelled as a real 3D cone of fabric: when her hips turn it swings round late, flares out
// and lifts, and on strong beats she spins. Her arms move in a slow wave from shoulder to fingertips.
const dancer = { yaw: { x: 0, v: 0 }, skirt: { x: 0, v: 0 }, goal: 0, spinGoal: 0, side: 1, ear: { x: 0, v: 0 }, stamp: [0, 0], lastSpin: -10, arm: 0, dabs: null };
function dancerBeat() {
  dancer.side *= -1;

const ARTS = {
  // segments: how many mirrored slices; drift: how far the slice wanders across the pattern
  medallion: { draw: medallion, segments: 8, drift: 0.09, zoom: 0.36 },
  arch: { scene: archScene },
  loom: { scene: loomScene },
  moon: { scene: moonScene },
  manton: { scene: mantonScene },
  feria: { scene: feriaScene }

const K = { spin: 0, punch: 0 };
function onBeat() {
  K.punch = 1;
  const art = ROOMS[roomIndex].pieces[pieceIndex].art;
  if (art === "arch") {
    arch.swing = 1;
    if (Math.random() < 0.35 && arch.mix >= 1) { arch.prev = arch.lattice; arch.lattice = (arch.lattice + 1) % 3; arch.mix = 0; }
  }
  if (art === "loom") loom.spark = 2;
  if (art === "moon") dancerBeat();
  if (art === "manton") { manton.fr.v += manton.side * (1.4 + S.bass); manton.ang.v += manton.side * 0.6; manton.side *= -1; }
  if (art === "feria") { feria.wave = 0; feria.splash = 1; feria.palm.v += (Math.random() < 0.5 ? -1 : 1) * (0.6 + S.bass); }
}

// ---------- The kaleidoscope: mirrors drawn as sharp shapes ----------
// The pattern is drawn again inside each mirrored slice, so every edge stays crisp.
const canvas = document.getElementById("art");
const screen = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function fit() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
}
fit(); window.addEventListener("resize", fit);
// The round window the kaleidoscope sits in, kept clear of the controls.
function stage() {
  const top = 28, bottom = 236, avail = Math.max(160, H - top - bottom);
  return { cx: W / 2, cy: top + avail / 2, radius: Math.min(avail / 2, W / 2 - 24) };
}

function render(t, dt) {
  const art = ARTS[ROOMS[roomIndex].pieces[pieceIndex].art];
  g = screen;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H);
  if (art.scene) { // pieces ii and iii are scenes, not kaleidoscopes
    const top = 28, avail = Math.max(160, H - top - 236);
    art.scene(t, dt, { x: 24, y: top, w: W - 48, h: avail });
    return;
  }
  K.spin += dt * (0.04 + S.mid * 0.6);
  K.punch *= Math.pow(0.02, dt);
  const st = stage(), R = st.radius;
  const wedge = Math.PI / art.segments;              // each mirrored slice
  const zoom = art.zoom * (1 - 0.12 * K.punch - 0.05 * S.bass);
  const k = R / (0.5 * zoom * SIZE);                 // sheet units to screen pixels
  // the part of the pattern being reflected wanders in a slow loop
  const sx = SIZE * (0.5 + Math.cos(t * 0.11) * art.drift), sy = SIZE * (0.5 + Math.sin(t * 0.07) * art.drift);

  for (let j = 0; j < art.segments * 2; j++) {
    g.save();
    g.translate(st.cx, st.cy);
    g.rotate(K.spin);
    if (j % 2) { g.rotate((j + 1) * wedge); g.scale(1, -1); } else g.rotate(j * wedge);
    g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R + 1, -0.015, wedge + 0.015); g.closePath(); g.clip();
    g.scale(k, k); g.rotate(t * 0.03); g.translate(-sx, -sy);
    art.draw(t);
    g.restore();
  }
  g.beginPath(); g.arc(st.cx, st.cy, R + 5, 0, TAU); g.strokeStyle = C.gold; g.lineWidth = 1.5; g.stroke();
  g.beginPath(); g.arc(st.cx, st.cy, R + 11, 0, TAU); g.strokeStyle = "rgba(42,44,42,0.45)"; g.lineWidth = 0.7; g.stroke();
}

// ================================================================
// 4. MAIN LOOP
// ================================================================
let last = performance.now(), time = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  listen(dt, time);
  render(time, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ================================================================
// 5. CONTROLS
// ================================================================
const roomsEl = document.getElementById("rooms"), piecesEl = document.getElementById("pieces");
const playBtn = document.getElementById("play"), live = document.getElementById("live");
const NUMERALS = ["i", "ii", "iii"];

ROOMS.forEach((room, i) => {
  const b = document.createElement("button");
  b.textContent = i + 1;
  b.setAttribute("aria-label", room ? "Style " + (i + 1) : "Style " + (i + 1) + ", coming soon");
  b.title = room ? "" : "Coming soon";
  b.disabled = !room;
  b.addEventListener("click", () => chooseRoom(i));
  roomsEl.appendChild(b);
});

function renderControls() {
  [...roomsEl.children].forEach((b, i) => b.setAttribute("aria-current", String(i === roomIndex)));
  piecesEl.innerHTML = "";
  ROOMS[roomIndex].pieces.forEach((p, i) => {
    const b = document.createElement("button");
    b.textContent = NUMERALS[i];
    b.setAttribute("aria-label", "Piece " + (i + 1));
    b.setAttribute("aria-pressed", String(i === pieceIndex));
    b.addEventListener("click", () => choosePiece(i));
    piecesEl.appendChild(b);
  });
}
function chooseRoom(i) {
  if (!ROOMS[i]) return;
  roomIndex = i; pieceIndex = 0;
  try { history.replaceState(null, "", "#s" + (i + 1)); } catch (e) {}
  renderControls();
  if (nowPlaying) play();
}
function choosePiece(i) {
  pieceIndex = i; renderControls();
  if (nowPlaying) play();
}
async function play() {
  setupAudio(); await ctx.resume();
  await startPiece(ROOMS[roomIndex].pieces[pieceIndex]);
  document.body.classList.add("playing");
  playBtn.setAttribute("aria-label", "Pause");
  live.textContent = "Playing piece " + (pieceIndex + 1);
}
function pause() {
  stopPiece();
  document.body.classList.remove("playing");
  playBtn.setAttribute("aria-label", "Play");
  live.textContent = "Paused";
}
playBtn.addEventListener("click", () => (nowPlaying ? pause() : play()));
window.addEventListener("keydown", e => { if (e.key === " " && e.target === document.body) { e.preventDefault(); playBtn.click(); } });

const start = parseInt((location.hash.match(/^#s(\d)$/) || [])[1], 10) - 1;
roomIndex = ROOMS[start] ? start : 0;
renderControls();
</script>
